<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NurseLink CV Maker</title><style>body{margin:0;background:#f2f6fb;color:#13233d;font:15px Arial,sans-serif}.top{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #d5e1ee}.brand{font-size:20px;font-weight:800}.brand b{color:#1475d5}.page{max-width:1100px;margin:30px auto;padding:0 18px}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.card{background:#fff;border:1px solid #d1e0ee;border-radius:14px;padding:20px}.eyebrow{font-size:11px;font-weight:bold;color:#1475d5;letter-spacing:.1em}h1{margin:6px 0;font-size:30px}h2{font-size:18px;margin:0 0 10px}p{color:#647a9c;line-height:1.5}.choice{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid #e4edf6}.choice input{accent-color:#1475d5}.save,button{background:#176fce;color:#fff;border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.save{width:100%;margin-top:16px}.cv{padding:34px;min-height:700px}.head{display:flex;justify-content:space-between;border-bottom:3px solid #1977d3;padding-bottom:17px}.photo{width:86px;height:86px;border-radius:50%;background:#254568;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold}.section{margin-top:22px}.section h3{color:#1475d5;font-size:13px;letter-spacing:.1em}.item{padding:8px 0}.item strong{display:block}.muted{font-size:13px;color:#6680a2}.actions{display:flex;gap:8px;align-items:center}.ghost{background:#fff;border:1px solid #bdd0e6;color:#176fce}@media(max-width:700px){.grid{grid-template-columns:1fr}.cv{padding:20px}}@media print{.top,.left,.actions{display:none}.page{margin:0}.grid{display:block}.card{border:0}.cv{padding:0}}</style></head><body><header class="top"><div class="brand"><b>NL</b> NurseLink <span class="muted">CV Maker</span></div><div class="actions"><button class="ghost" onclick="location.href='/portfolio'">Back to Portfolio</button><button onclick="window.print()">Print / Save PDF</button></div></header><main class="page"><span class="eyebrow">MEMBER-CONTROLLED CV</span><h1>Build your professional CV</h1><p>Select only the profile details you want to include. Your private documents and reviewer notes are excluded.</p><div class="grid"><aside class="card left"><h2>CV settings</h2><label class="choice"><input type="checkbox" id="photo" checked> Include my profile photo</label><div id="choices"></div><button class="save" id="save">Save CV draft</button><p id="notice" class="muted"></p></aside><section class="card cv" id="cv">Loading your approved portfolio…</section></div></main><script>const API='https://api.amsertech.com';let data={},settings={};const esc=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));async function load(){let r=await fetch(API+'/api/nurselink/cv-maker',{credentials:'include',headers:{Accept:'application/json'}});let p=await r.json();data=p.data.member;settings=p.data.settings||{};render()}function render(){const s=data.portfolio_summary||{},pr=data.profile||{},sections=settings.sections||['summary','experience','education','credentials','competencies','languages'];document.getElementById('photo').checked=settings.include_photo!==false;const labels={summary:'Professional summary',experience:'Work experience',education:'Education',credentials:'Licences & certifications',competencies:'Skills & competencies',languages:'Languages'};document.getElementById('choices').innerHTML=Object.entries(labels).map(([k,v])=>`<label class="choice"><input type="checkbox" value="${k}" ${sections.includes(k)?'checked':''}> ${v}</label>`).join('');const name=[pr.first_name,pr.middle_name,pr.last_name].filter(Boolean).join(' ')||data.member_number||'NurseLink Member';const show=k=>sections.includes(k);const list=(a,fn)=>a?.length?`<div class="section">${a.map(fn).join('')}</div>`:'';document.getElementById('cv').innerHTML=`<div class="head"><div><h1>${esc(name)}</h1><strong>${esc(s.professional_headline||pr.professional_title||'NurseLink Member')}</strong><p>${esc(pr.email||'')}</p></div>${settings.include_photo!==false?'<div class="photo">NL</div>':''}</div>${show('summary')?`<div class="section"><h3>PROFESSIONAL SUMMARY</h3><p>${esc(s.professional_summary||'Review and add your professional summary before publishing this CV.')}</p></div>`:''}${show('experience')?list(data.employment,e=>`<div class="section item"><strong>${esc(e.position_title)}</strong><span class="muted">${esc(e.employer)} · ${esc(e.city||'')} ${e.country?'· '+esc(e.country):''}</span></div>`):''}${show('education')?list(data.education,e=>`<div class="section item"><strong>${esc(e.qualification)}</strong><span class="muted">${esc(e.institution)}</span></div>`):''}${show('competencies')?`<div class="section"><h3>SKILLS & COMPETENCIES</h3><p>${(data.competencies||[]).map(x=>esc(x.name)).join(' · ')}</p></div>`:''}${show('languages')?`<div class="section"><h3>LANGUAGES</h3><p>${(data.languages||[]).map(x=>esc(x.language)).join(' · ')}</p></div>`:''}`;}document.getElementById('save').onclick=async()=>{let sections=[...document.querySelectorAll('#choices input:checked')].map(x=>x.value);let r=await fetch(API+'/sanctum/csrf-cookie',{credentials:'include'});let token=decodeURIComponent((document.cookie.match(/XSRF-TOKEN=([^;]+)/)||[])[1]||'');await fetch(API+'/api/nurselink/cv-maker',{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':token,Accept:'application/json'},body:JSON.stringify({include_photo:document.getElementById('photo').checked,sections})});settings={include_photo:document.getElementById('photo').checked,sections};render();document.getElementById('notice').textContent='CV draft saved.'};load().catch(()=>document.getElementById('cv').textContent='Unable to load your CV draft. Please sign in again.');</script></body></html>
